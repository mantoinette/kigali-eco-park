spring:
  application:
    name: kigali-eco-park
  datasource:
    # Port 5435 = Docker Compose Postgres for this project (see docker-compose.yml)
    # On Render set DB_SSLMODE=require (or leave default require when DB_HOST is set via env).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:kigali_eco_park_db}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: never

server:
  # Render sets PORT; bind all interfaces so the platform health check can see it
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8082}}

app:
  # In production, set PUBLIC_SITE_URL to the deployed HTTPS website.
  # Every printed tree QR code uses this value.
  frontend-base-url: ${PUBLIC_SITE_URL:http://localhost:5173}
  api:
    public-base-url: ${PUBLIC_API_URL:http://localhost:8082}
  cors:
    # Comma-separated. On Render also set CORS_ALLOWED_ORIGINS / PUBLIC_SITE_URL.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://kigali-eco-park.vercel.app}
  upload:
    root: uploads
    public-base-url: ${PUBLIC_API_URL:http://localhost:8082}
