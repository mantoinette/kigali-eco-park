spring:
  application:
    name: kigali-eco-park
  datasource:
    # Port 5435 = Docker Compose Postgres for this project (see docker-compose.yml)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:kigali_eco_park_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: never

server:
  # 8082 avoids conflicts with local services already using 8080/8081
  port: ${SERVER_PORT:8082}

app:
  # In production, set PUBLIC_SITE_URL to the deployed HTTPS website.
  # Every printed tree QR code uses this value.
  frontend-base-url: ${PUBLIC_SITE_URL:http://localhost:5173}
  api:
    public-base-url: ${PUBLIC_API_URL:http://localhost:8082}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  upload:
    root: uploads
    public-base-url: ${PUBLIC_API_URL:http://localhost:8082}
