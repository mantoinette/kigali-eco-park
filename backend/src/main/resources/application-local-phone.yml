spring:
  config:
    activate:
      on-profile: local-phone

app:
  # Phone testing on the same Wi-Fi — QR codes use your PC's LAN IP, not localhost.
  # If phone scan fails, check your PC Wi-Fi IP (ipconfig) and set:
  #   PUBLIC_SITE_URL=http://YOUR-IP:5173
  #   PUBLIC_API_URL=http://YOUR-IP:8082
  frontend-base-url: ${PUBLIC_SITE_URL:http://192.168.1.66:5173}
  api:
    public-base-url: ${PUBLIC_API_URL:http://192.168.1.66:8082}
  upload:
    public-base-url: ${PUBLIC_API_URL:http://192.168.1.66:8082}
  cors:
    allow-local-network: true
