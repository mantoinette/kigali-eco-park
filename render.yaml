# Render Blueprint — backend API for TreeScan Rwanda / Kigali Eco-Park
# Dashboard: New > Blueprint > connect repo, or copy settings into an existing Web Service.

services:
  - type: web
    name: kigali-eco-park
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JAVA_OPTS
        value: -Xmx384m -XX:+UseContainerSupport
      - key: DB_HOST
        fromDatabase:
          name: kigali-eco-park-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kigali-eco-park-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: kigali-eco-park-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: kigali-eco-park-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kigali-eco-park-db
          property: password
      - key: DB_SSLMODE
        value: require
      - key: PUBLIC_API_URL
        value: https://kigali-eco-park.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://kigali-eco-park.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://kigali-eco-park.vercel.app

databases:
  - name: kigali-eco-park-db
    plan: free
